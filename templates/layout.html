<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{pageTitle}}</title>
<meta name="description" content="{{metaDescription}}">
<link rel="stylesheet" href="{{root}}style.css">
<link rel="alternate" type="application/rss+xml" title="{{siteTitle}}" href="{{root}}rss.xml">
<script>
  // 在畫面繪製前就決定佈景，避免深色模式下開頁閃一下白光。
  try {
    var saved = localStorage.getItem('theme');
    if (saved === 'dark' || saved === 'light') {
      document.documentElement.setAttribute('data-theme', saved);
    }
  } catch (e) {}
</script>
</head>
<body>

<header class="site-header">
  <nav class="nav">
    <a class="nav-brand" href="{{root}}">{{siteTitle}}</a>
    <div class="nav-links">
      {{#each nav}}<a href="{{href}}">{{label}}</a>{{/each}}
      <button class="theme-toggle" type="button" aria-label="切換深色模式" title="切換深色模式">
        <span class="theme-icon-light" aria-hidden="true">☀</span>
        <span class="theme-icon-dark" aria-hidden="true">☾</span>
      </button>
    </div>
  </nav>
</header>

<main class="content">
{{{body}}}
</main>

<footer class="site-footer">
  <p>© {{year}} {{author}} · {{#each footerLinks}}<a href="{{href}}">{{label}}</a> · {{/each}}<a href="{{root}}rss.xml">RSS</a></p>
</footer>

<script>
  (function () {
    function currentTheme() {
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      return document.documentElement.getAttribute('data-theme') || (prefersDark ? 'dark' : 'light');
    }

    // giscus 在 iframe 裡，不會跟著站台的 data-theme 換色，要用 postMessage 通知。
    // 只有文章頁有留言區，其他頁面找不到 iframe 就直接跳過。
    function syncGiscusTheme(theme) {
      var frame = document.querySelector('iframe.giscus-frame');
      if (!frame || !frame.contentWindow) return;
      frame.contentWindow.postMessage(
        { giscus: { setConfig: { theme: theme } } },
        'https://giscus.app'
      );
    }

    // giscus 以 preferred_color_scheme 開場；使用者若先前手動選過佈景，
    // 要在它載入完成時補送一次，否則會一深一淺。
    window.addEventListener('message', function (event) {
      if (event.origin !== 'https://giscus.app') return;
      if (!event.data || !event.data.giscusIncomingMessage) return;
      syncGiscusTheme(currentTheme());
    });

    var button = document.querySelector('.theme-toggle');
    if (!button) return;
    button.addEventListener('click', function () {
      var next = currentTheme() === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
      syncGiscusTheme(next);
    });
  })();
</script>

</body>
</html>
